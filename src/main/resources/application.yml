spring:
  profiles:
    default: local

  datasource:
    url: jdbc:h2:mem:tradeguide
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: false

twelve-data:
  # 로컬에서 재정의할 때는 application-local.yml에도 같은 경로를 써야 바인딩된다:
  #   twelve-data:
  #     api-key: <TWELVE_DATA_API_KEY 값>
  api-key: ${TWELVE_DATA_API_KEY:}

tradeguide:
  auth:
    enabled: false
  broker:
    # 기존 단일 키 프로퍼티. 아래 encryption-keys에 값이 있는 항목이 하나도 없으면
    # 이 값을 버전 1 키로 취급해 하위 호환한다.
    encryption-key: ${BROKER_CREDENTIAL_ENCRYPTION_KEY:}
    # 버전별 키 목록. 값이 설정되지 않은 항목(빈 문자열)은 무시된다.
    encryption-keys:
      - version: 1
        value: ${BROKER_CREDENTIAL_ENCRYPTION_KEY_V1:}
      - version: 2
        value: ${BROKER_CREDENTIAL_ENCRYPTION_KEY_V2:}
    # 신규 암호화(encrypt)에 사용할 현재 버전. encryption-keys 목록에 있는 버전이거나,
    # encryption-keys가 비어 있으면 encryption-key를 가리키는 1이어야 한다.
    encryption-current-version: ${BROKER_CREDENTIAL_ENCRYPTION_CURRENT_VERSION:1}
    http:
      # 토스증권 등 브로커 어댑터 RestClient의 보수적 기본값이다. 토스가 문서화한 제한이
      # 아니라 우리 쪽 HTTP 클라이언트 설정이며, BrokerDuplicateCallGuard의 진행 중 잠금이
      # 응답 없는 호출에서 무기한 풀리지 않게 하는 전제 조건이다.
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
    rotation:
      # 기본은 항상 비활성이다. 운영자가 로컬 셸이나 배포 파이프라인에서 이 값을 명시적으로
      # true로 켜고 애플리케이션을 기동했을 때만 오프라인 재암호화 배치가 실행된다. HTTP
      # 엔드포인트·스케줄러·프런트엔드 어디에도 연결하지 않는다
      # (docs/agent-tasks/broker-credential-encryption-key-rotation.md §1 결정 1, §9).
      run-on-startup: ${BROKER_CREDENTIAL_ROTATION_RUN_ON_STARTUP:false}
      # 배치 한 건에서 처리하는 행 수(값 단위 표, 계좌 단위 표 각각). 임의 상수이므로
      # 별도 승인을 받은 값이다(§1 결정 3).
      batch-size: ${BROKER_CREDENTIAL_ROTATION_BATCH_SIZE:200}
      # 실행 기록의 triggered_by에 남는 식별자다. 회원 행을 참조하지 않는다 — 로테이션은
      # 회원 행위가 아니라 운영 행위다(§8).
      triggered-by: ${BROKER_CREDENTIAL_ROTATION_TRIGGERED_BY:OPERATOR}
      # 진행 중(IN_PROGRESS)인 실행이 이미 있을 때의 기본 동작은 거부다. 운영자가 중단된
      # 실행을 이어서 진행하기로 명시적으로 결정했을 때만 이 값을 true로 켠다. 자동
      # 재시작은 하지 않는다(§6.2, §7).
      resume-in-progress: ${BROKER_CREDENTIAL_ROTATION_RESUME_IN_PROGRESS:false}
